[project]
name = "ai-operations-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph", "langgraph-cli[inmem]", "langchain-openai", "langchain-google-genai", "fastapi", "python-dotenv"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["ops*"]
